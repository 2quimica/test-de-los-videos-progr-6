    // Guardar en localStorage protegido
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("No se pudo guardar en localStorage", e);
      }
    }

    // Cargar de localStorage protegido
    function loadFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.startedAt) {
            state = parsed;
            // Verificar si el tiempo de 15 min (900 seg) ya venció
            const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
            if (elapsed >= 900 && !state.finished) {
              finishQuiz('time_out');
            }
            return true;
          }
        }
      } catch (e) {
        console.warn("Error leyendo localStorage", e);
      }
      return false;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!state.startedAt || state.finished) {
          clearInterval(timerInterval);
          return;
        }

        const elapsedSeconds = Math.floor((Date.now() - state.startedAt) / 1000);
        const remainingSeconds = Math.max(0, 900 - elapsedSeconds);

        updateTimerUI(remainingSeconds);

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          finishQuiz('time_out');
        }
      }, 250);
    }

    function updateTimerUI(seconds) {
      const timerElement = document.getElementById('timer-display');
      if (!timerElement) return;

      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      const formatted = `⏱ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      timerElement.textContent = formatted;

      // Cambios visuales por tiempo
      timerElement.className = 'timer-badge';
      if (seconds <= 30) {
        timerElement.classList.add('timer-critical');
      } else if (seconds <= 120) {
        timerElement.classList.add('timer-warning');
      }
    }

    function finishQuiz(reason) {
      if (state.finished) return;

      state.finished = true;
      state.finishReason = reason;

      if (timerInterval) clearInterval(timerInterval);

      // Evaluar preguntas no respondidas como incorrectas
      for (let i = 0; i < 30; i++) {
        if (state.answers[i] === null) {
          state.answers[i] = -1; // No contestada
          state.graded[i] = false;
        }
      }

      saveToStorage();
      renderApp();
    }

      const usedMins = Math.floor(elapsedSeconds / 60);
      const usedSecs = elapsedSeconds % 60;
      const timeUsedStr = `${String(usedMins).padStart(2, '0')}:${String(usedSecs).padStart(2, '0')}`;

      const now = new Date();
      const dateStr = now.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
      const timeStr = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      container.innerHTML = `
        <div class="evidence-card">
          <span class="header-badge">EVIDENCIA DE EVALUACIÓN</span>
          <h2 style="color: #ffffff; font-size: 1.2rem; margin-bottom: 2px;">LA ENERGÍA EN LOS PROCESOS DE LA VIDA DIARIA</h2>
          <p style="color: var(--accent-cyan); font-weight: 700; font-size: 0.85rem; margin-bottom: 12px;">PROGRESIÓN 6: RAYOS X Y EFECTO FOTOELÉCTRICO</p>

          <div style="background-color: #0d1322; border-radius: 12px; padding: 12px; margin-bottom: 12px;">
            <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-main);">${state.user.name}</div>
            <div style="font-size: 0.9rem; font-weight: 700; color: var(--accent-cyan);">GRUPO: ${state.user.group}</div>
          </div>

          <div class="score-big">${percentage}%</div>
          <div style="font-weight: 800; font-size: 1.1rem; color: var(--text-main); margin-bottom: 6px;">
            ${correctCount} / 30 ACIERTOS
          </div>

          <div class="performance-badge ${performanceClass}">
            ${performanceText}
          </div>

          <table class="summary-table">
            <tr>
              <td>Preguntas Totales:</td>
              <td>30</td>
            </tr>
            <tr>
              <td>Aciertos Correctos:</td>
              <td>${correctCount}</td>
            </tr>
            <tr>
              <td>Respuestas Incorrectas:</td>
              <td>${30 - correctCount - unansweredCount}</td>
            </tr>
            <tr>
              <td>Sin Contestar:</td>
              <td>${unansweredCount}</td>
            </tr>
            <tr>
              <td>Tiempo Utilizado:</td>
              <td>${timeUsedStr} / 15:00 min</td>
            </tr>
            <tr>
              <td>Estado de Entrega:</td>
              <td>${state.finishReason === 'time_out' ? '⏱ TIEMPO FINALIZADO' : '✅ COMPLETADO A TIEMPO'}</td>
            </tr>
            <tr>
              <td>Fecha y Hora Local:</td>
              <td>${dateStr} - ${timeStr}</td>
            </tr>
          </table>

          <div class="camera-notice-box">
            📸 TOMA UNA CAPTURA DE ESTA PANTALLA Y ENVÍALA A TU PROFESOR COMO EVIDENCIA.
          </div>

          <button class="btn btn-primary" style="margin-top: 20px; background: var(--bg-card); border: 1px solid var(--border-color);" onclick="handleResetQuiz()">
            🔄 Reiniciar para otro estudiante
          </button>
        </div>
      `;
    }

    function handleResetQuiz() {
      if (confirm("¿Deseas borrar esta evidencia para iniciar una nueva evaluación?")) {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch(e) {}
        state = {
          user: { name: '', group: '' },
          startedAt: null,
          currentQuestion: 0,
          answers: new Array(30).fill(null),
          graded: new Array(30).fill(null),
          finished: false,
          finishReason: ''
        };
        renderApp();
      }
    }

    window.onload = function() {
      loadFromStorage();
      renderApp();
    };
  </script>
</body>
</html>
